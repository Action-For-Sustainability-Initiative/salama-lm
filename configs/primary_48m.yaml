# Primary experiment model (~48M params untied):
#   blocks 12*512^2*10 = 31.5M ; embeddings 2*16384*512 = 16.8M
# Token budget ~1.2B (~25 tok/param — slightly past Chinchilla-optimal).
# Estimated 8-12h on the RTX 4060 Laptop at the measured pilot throughput
# scaled for model size [C] — the run log will give the real number.
model:
  n_layers: 10
  d_model: 512
  n_heads: 8
  d_head: 64
  n_ctx: 512
  d_vocab: 16384
  act_fn: gelu
  normalization_type: RMS
  positional_embedding_type: rotary
train:
  seed: 1234
  lr: 5.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 700
  max_steps: 33000           # ~1.22B tokens at 24*3*512 = 36,864 tok/step
  micro_batch_size: 24
  grad_accum: 3
  grad_clip: 1.0
  eval_every: 1000
  ckpt_every: 1000
data:
  train_bin: data/full/train.bin
  val_bins:
    en: data/full/val_en.bin
    sw: data/full/val_sw.bin
    cs: data/full/val_cs.bin
out_dir: checkpoints/primary_48m
