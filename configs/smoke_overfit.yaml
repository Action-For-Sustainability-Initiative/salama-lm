# Tiny-overfit correctness test: a healthy model + training loop must be able
# to memorise a single fixed batch to near-zero loss. If it cannot, something
# (masking, loss, optimiser, data pipeline) is broken. This config is used by
# tests/test_overfit.py and stays in the repo as a permanent smoke test.
model:
  n_layers: 2
  d_model: 128
  n_heads: 4
  d_head: 32
  n_ctx: 256
  d_vocab: 16384
  act_fn: gelu
  normalization_type: RMS
  positional_embedding_type: rotary
train:
  seed: 1234
  lr: 1.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.0        # no decay when memorising on purpose
  warmup_steps: 10
  max_steps: 400
  micro_batch_size: 4
  grad_accum: 1
  grad_clip: 1.0
  eval_every: 0            # no held-out eval in the overfit test
  ckpt_every: 0
out_dir: checkpoints/smoke_overfit
