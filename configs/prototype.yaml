# Prototype model (~23M params untied): pipeline validation + fast iteration.
# Untied embed/unembed (TransformerLens convention): params ~= 12*d^2*L + 2*V*d
#   blocks: 12 * 384^2 * 6 = 10.6M ; embeddings: 2 * 16384 * 384 = 12.6M
model:
  n_layers: 6
  d_model: 384
  n_heads: 6
  d_head: 64
  n_ctx: 512
  d_vocab: 16384
  act_fn: gelu
  normalization_type: RMS
  positional_embedding_type: rotary
train:
  seed: 1234
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 300
  max_steps: 12000           # ~0.4B tokens at 32*512*2 tokens/step
  micro_batch_size: 32
  grad_accum: 2
  grad_clip: 1.0
  eval_every: 500
  ckpt_every: 1000
data:
  train_bin: data/pilot/train.bin
  val_bins:
    en: data/pilot/val_en.bin
    sw: data/pilot/val_sw.bin
out_dir: checkpoints/prototype
